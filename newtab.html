<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="newtab">
  <main class="page">
    <header class="head">
      <div class="top">
        <span class="left"><span id="date"></span><span id="weather" class="weather"></span></span>
        <button class="wellness" id="wellness" title="Another tip"></button>
        <span class="right">
          <span id="breakbar"></span>
          <button class="btn quiet" id="quiet-open" title="Stop all notifications until tomorrow morning">Quiet today</button>
          <button class="btn quiet" id="search-open" title="Search your tasks (/)">Search</button>
          <button class="btn quiet" id="review-open">Weekly review</button>
          <button class="btn quiet" id="help-open" title="Help (?)">Help</button>
          <button class="btn quiet" id="settings">Settings</button>
        </span>
      </div>
    </header>

    <div class="cols">
      <div class="col col-left">
        <section class="shortcuts" id="shortcuts" aria-label="Shortcuts"></section>
        <div class="foot" id="foot"></div>
        <section class="done-today" id="done-today" aria-label="Done today"></section>
        <section class="stats" id="stats" aria-label="Last 7 days"></section>
      </div>

      <div class="col col-center">
        <section class="shutdown" id="shutdown" hidden></section>
        <section class="twomin" id="twomin" hidden></section>
        <section class="focus" id="focus" aria-live="polite" hidden></section>
        <section class="nudge" id="nudge" aria-live="polite"></section>
        <section class="today" id="today" aria-label="Today's Top 3"></section>
        <section class="deadlines" id="deadlines" aria-label="Deadlines"></section>
        <section class="areas" id="areas" aria-label="Your projects"></section>
        <section class="time" aria-label="Find something that fits">
          <div class="row">
            <span>I have</span>
            <button class="btn chip" data-min="15" aria-pressed="false">15m</button>
            <button class="btn chip" data-min="30" aria-pressed="false">30m</button>
            <button class="btn chip" data-min="60" aria-pressed="false">1h</button>
            <button class="btn chip" data-min="120" aria-pressed="false">2h</button>
          </div>
          <div id="fits"></div>
        </section>
      </div>

      <div class="col col-right">
        <aside id="postit" aria-label="Quick note"></aside>
        <section id="golden-section" aria-label="Hand-picked sites"></section>
      </div>
    </div>
  </main>

  <dialog id="add" aria-labelledby="add-title"></dialog>
  <dialog id="sc-dialog" aria-labelledby="sc-title"></dialog>
  <dialog id="pick" class="wide-dialog" aria-labelledby="pick-title"></dialog>
  <dialog id="review" class="wide-dialog" aria-labelledby="review-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="help" aria-labelledby="help-title"></dialog>
  <dialog id="quiet-dialog" aria-labelledby="quiet-title"></dialog>
  <dialog id="search" class="wide-dialog" aria-label="Search your tasks"></dialog>
  <div class="help-box" id="help-box" hidden></div>
  <script type="module" src="newtab.js"></script>
</body>
</html>
